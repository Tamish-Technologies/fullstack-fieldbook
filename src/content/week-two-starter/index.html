<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Tasks | Week 2 starter (Week 1 baseline)</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <p class="eyebrow">STUDENT PRODUCTIVITY</p>
      <h1>Study Tasks</h1>
      <p>Keep your next steps simple and visible.</p>
    </header>

    <form id="task-form" class="task-form">
      <label for="task-input">New task</label>
      <div class="form-row">
        <input id="task-input" name="task" type="text"
               placeholder="e.g. Review JavaScript functions"
               maxlength="100" required>
        <button type="submit">Add task</button>
      </div>
      <p id="form-error" class="error" role="alert" hidden>
        Enter a task with at least one non-space character.
      </p>
    </form>

    <section aria-labelledby="tasks-heading" class="tasks-section">
      <h2 id="tasks-heading">My tasks</h2>
      <p id="empty-state" class="empty-state">No tasks yet. Add your first one.</p>
      <ul id="task-list" class="task-list"></ul>
    </section>
  </main>
</body>
</html>
